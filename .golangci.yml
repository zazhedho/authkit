version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  relative-path-mode: gomod

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - bodyclose
    - dupl
    - errorlint
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
  settings:
    revive:
      rules:
        - name: var-naming
        - name: exported
    dupl:
      threshold: 80
    misspell:
      locale: US
  exclusions:
    rules:
      - linters:
          - misspell
        text: "`thn` is a misspelling of `then`"
      - path: internal/repositories/session/
        linters:
          - gosec
        text: "G117:"
      - path: internal/services/reset/reset_service_test.go
        linters:
          - gosec
        text: "G101: Potential hardcoded credentials"
      - path: _test\.go
        linters:
          - noctx
      # Table-driven tests repeat setup on purpose.
      - path: _test\.go
        linters:
          - dupl

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/zazhedho/authkit
